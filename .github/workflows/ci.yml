name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this job only checks out code and runs a build, it never
# needs to write anything back to the repo — overrides whatever broader
# default the org/repo's GITHUB_TOKEN permissions setting might otherwise
# grant.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # fess-parent (pom.xml's <parent>) wires up com.mycila:license-maven-plugin
      # and net.revelc.code.formatter:formatter-maven-plugin -- the same code-quality
      # tooling Fess itself uses (it has no checkstyle/PMD/spotbugs setup). Their
      # bound executions run "check" (fails on a missing/wrong license header) and
      # "format" (silently rewrites files to the Eclipse formatter config) respectively,
      # so invoking them directly here instead, before the build touches anything,
      # means a formatting drift fails CI loudly rather than getting auto-fixed and
      # passing regardless.
      - name: Check code style and license headers
        run: >-
          mvn -B
          net.revelc.code.formatter:formatter-maven-plugin:validate
          com.mycila:license-maven-plugin:check

      - name: Build and test
        run: mvn -B clean package
